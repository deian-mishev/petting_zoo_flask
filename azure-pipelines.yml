trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: deployApp
    displayName: Deploy image (disable when preparing checkpoint migration)
    type: boolean
    default: true

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - script: |
      docker build -t petting-zoo-web:$(Build.BuildId) .
    displayName: Build Flask image

  - script: |
      docker run --rm \
        --mount "type=bind,source=$(Build.SourcesDirectory)/tests,target=/app/tests,readonly" \
        petting-zoo-web:$(Build.BuildId) \
        python -m unittest discover -s tests -p 'test_*.py' -v
    displayName: Run unit tests

  - task: Docker@2
    displayName: Log in to Azure Container Registry
    inputs:
      command: login
      containerRegistry: petting-zoo-acr

  - script: |
      docker tag petting-zoo-web:$(Build.BuildId) \
        pettingzoo1643228121.azurecr.io/petting-zoo-web:$(Build.BuildId)
      docker push pettingzoo1643228121.azurecr.io/petting-zoo-web:$(Build.BuildId)
    displayName: Push tested image to registry

  - task: AzureCLI@2
    displayName: Check access to web app
    inputs:
      azureSubscription: petting-zoo-deploy
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az containerapp show \
          --name petting-zoo-web \
          --resource-group rg-petting-zoo-dev \
          --query "{name:name,image:properties.template.containers[0].image}" \
          --output table

  - task: AzureCLI@2
    displayName: Deploy Flask image
    condition: and(succeeded(), ${{ eq(parameters.deployApp, true) }})
    inputs:
      azureSubscription: petting-zoo-deploy
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        backend=$(az containerapp show \
          --name petting-zoo-web \
          --resource-group rg-petting-zoo-dev \
          --query "properties.template.containers[?name=='petting-zoo-web'].env[] | [?name=='MODEL_CHECKPOINT_BACKEND'].value | [0]" \
          --output tsv)
        if [ "$backend" != "azure_blob" ]; then
          echo "Checkpoint migration required: image pushed, deployment blocked."
          echo "Stop old writers, bootstrap Blob checkpoints, then cut over the image and backend together."
          exit 1
        fi
        az containerapp update \
          --name petting-zoo-web \
          --resource-group rg-petting-zoo-dev \
          --container-name petting-zoo-web \
          --image "pettingzoo1643228121.azurecr.io/petting-zoo-web:$(Build.BuildId)" \
          --output none
